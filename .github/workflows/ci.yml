name: Quality & Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zarbulmasal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test, and build Android
    outputs:
      android_release_ready: ${{ steps.android_release_status.outputs.ready }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test tool/validate_literature_json.dart
          tool/validate_literary_content.dart

      - name: Validate literature JSON
        run: dart run tool/validate_literature_json.dart

      - name: Validate literary content
        run: dart run tool/validate_literary_content.dart

      - name: Run strict provenance linter
        run: python3 tool/provenance_linter.py

      - name: Run adversarial provenance re-audit
        run: python3 tool/provenance_repair_loop5_adversarial.py

      - name: Verify uploaded source inventory
        run: |
          python3 tool/literature_pipeline/scripts/discover_pdfs.py
          git diff --exit-code -- docs/literature/SOURCE_INVENTORY.md

      - name: Exercise literature asset pipeline
        run: python3 tool/literature_pipeline/scripts/build_assets.py

      - name: Test literature asset pipeline
        run: python3 tool/literature_pipeline/scripts/test_build_assets.py

      - name: Test literature duplicate and portrait guards
        run: |
          python3 tool/test_merge_duplicate_works.py
          python3 tool/test_extract_portraits.py

      - name: Test enrichment tool safety
        run: python3 -m unittest tool.test_enrich_all_poets_final_safety -v

      - name: Test legacy literature writer guards
        run: python3 -m unittest tool.test_legacy_literature_guards -v

      - name: Test provenance guards
        run: python3 -m unittest tool.test_provenance_detector tool.test_provenance_linter_sources tool.test_validate_literary_content_report -v

      - name: Check release shell syntax
        run: |
          bash -n tool/verify_android_signing_material.sh
          bash -n tool/verify_android_bundle.sh
          bash -n tool/verify_android_bundletool_alignment.sh
          bash -n tool/verify_android_release_artifacts.sh
          bash -n tool/prepare_android_downloads.sh
          bash -n tool/prepare_web_release.sh
          bash -n tool/deploy_gh_pages.sh
          bash -n tool/serve_web.sh

      - name: Test Android bundle alignment verifier
        run: |
          python3 -m unittest tool.test_android_bundle_alignment -v
          python3 tool/test_android_bundle_alignment.py -q

      - name: Test coverage gate
        run: python3 -m unittest tool.test_check_coverage -v

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Enforce coverage threshold
        run: python3 tool/check_coverage.py coverage/lcov.info --minimum 80

      - name: Check Android release configuration
        id: android_release_status
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_RELEASE_CERT_SHA256: ${{ secrets.EXPECTED_RELEASE_CERT_SHA256 }}
        run: |
          ready=true
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_RELEASE_CERT_SHA256; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::warning::Missing required Android release secret: $secret_name"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Build Android APK for CI
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build signed public Android APKs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.android_release_status.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_RELEASE_CERT_SHA256: ${{ secrets.EXPECTED_RELEASE_CERT_SHA256 }}
        run: |
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_RELEASE_CERT_SHA256; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Missing required Android release secret: $secret_name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          bash tool/verify_android_signing_material.sh
          flutter build apk --release --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols/android
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols/android

          # Google Play distribution uses the signed App Bundle. Keep this in
          # the same secret-gated step as the public APKs so a successful main
          # release always produces a Play-uploadable artifact as well.
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/android

      - name: Verify signed Play App Bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.android_release_status.outputs.ready == 'true'
        env:
          EXPECTED_RELEASE_CERT_SHA256: ${{ secrets.EXPECTED_RELEASE_CERT_SHA256 }}
        run: bash tool/verify_android_bundle.sh build/app/outputs/bundle/release/app-release.aab

      - name: Verify bundletool 16 KB configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.android_release_status.outputs.ready == 'true'
        run: |
          bundletool_version='1.18.3'
          bundletool_url="https://github.com/google/bundletool/releases/download/${bundletool_version}/bundletool-all-${bundletool_version}.jar"
          bundletool_jar="$RUNNER_TEMP/bundletool-${bundletool_version}.jar"
          curl --fail --silent --show-error --location "$bundletool_url" -o "$bundletool_jar"
          printf '%s  %s\n' \
            'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' \
            "$bundletool_jar" | sha256sum --check --status
          bash tool/verify_android_bundletool_alignment.sh \
            build/app/outputs/bundle/release/app-release.aab "$bundletool_jar"

      - name: Verify retained Android release evidence
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.android_release_status.outputs.ready == 'true'
        env:
          EXPECTED_RELEASE_CERT_SHA256: ${{ secrets.EXPECTED_RELEASE_CERT_SHA256 }}
        run: bash tool/verify_android_release_artifacts.sh build/app/outputs/bundle/release/app-release.aab

      - name: Verify public Android packages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.android_release_status.outputs.ready == 'true'
        env:
          EXPECTED_RELEASE_CERT_SHA256: ${{ secrets.EXPECTED_RELEASE_CERT_SHA256 }}
        run: bash tool/prepare_android_downloads.sh build/app/outputs/flutter-apk "$RUNNER_TEMP/android-verification"

      - name: Upload verified public APKs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.android_release_status.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zarbulmasal-public-apks
          path: build/app/outputs/flutter-apk
          if-no-files-found: error
          retention-days: 30

      # Keep release diagnostics in a separate artifact. The Pages job only
      # downloads the APK-rooted artifact; mixing paths from build/ would make
      # upload-artifact use build/ as its archive root and break APK staging.
      - name: Upload retained Android release evidence
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.android_release_status.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zarbulmasal-android-release-evidence
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
            build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip
            build/symbols/android
          if-no-files-found: error
          retention-days: 30

  web:
    name: Build web app
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build web app
        run: >-
          flutter build web --release
          --base-href /zarbulmasal/
          --no-web-resources-cdn
          --no-wasm-dry-run

      - name: Verify published privacy policy
        run: |
          test -s build/web/privacy.html
          grep -Fq 'Zarbulmasal Privacy Policy' build/web/privacy.html
          grep -Fq 'Last updated: 21 September 2026' build/web/privacy.html
          grep -Fq 'Навсозии охирин: 21 сентябри 2026' build/web/privacy.html
          grep -Fq 'آخرین به‌روزرسانی: ۲۱ سپتامبر ۲۰۲۶' build/web/privacy.html

      - name: Version offline cache from compiled application
        run: bash tool/prepare_web_release.sh

      - name: Install pinned browser-audit runtime
        run: |
          python3 -m pip install --disable-pip-version-check --user "playwright==1.62.0"
          python3 -m playwright install --with-deps chromium

      - name: Audit release web artifact in Chromium
        run: |
          set -euo pipefail
          audit_dir="$RUNNER_TEMP/zarbulmasal-browser-audit"
          server_log="$RUNNER_TEMP/zarbulmasal-web-server.log"
          bash tool/serve_web.sh >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:8080/zarbulmasal/ >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log"
              exit 1
            fi
            sleep 1
          done

          python3 tool/deep_browser_audit.py \
            http://127.0.0.1:8080/zarbulmasal/ \
            "$audit_dir"

      - name: Upload browser-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zarbulmasal-browser-audit
          path: |
            ${{ runner.temp }}/zarbulmasal-browser-audit
            ${{ runner.temp }}/zarbulmasal-web-server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Remove unavailable Android downloads portal
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.quality.outputs.android_release_ready != 'true'
        run: |
          rm -rf build/web/android build/web/downloads
          test ! -e build/web/android
          test ! -e build/web/downloads

      - name: Download verified public APKs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.quality.outputs.android_release_ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: zarbulmasal-public-apks
          path: build/app/outputs/flutter-apk

      - name: Add verified Android downloads to Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.quality.outputs.android_release_ready == 'true'
        env:
          EXPECTED_RELEASE_CERT_SHA256: ${{ secrets.EXPECTED_RELEASE_CERT_SHA256 }}
        run: bash tool/prepare_android_downloads.sh

      - name: Upload prepared site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gh-pages-site
          path: build/web
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish gh-pages branch
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository for publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download prepared site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gh-pages-site
          path: site

      - name: Publish prepared site to gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PUBLISH_DIR: ${{ runner.temp }}/zarbulmasal-gh-pages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Checkout intentionally does not persist credentials. Configure a
          # token-scoped remote explicitly for the protected fetch/push below.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin gh-pages
          pages_base_sha="$(git rev-parse refs/remotes/origin/gh-pages)"
          git worktree add --detach "$PUBLISH_DIR" origin/gh-pages
          find "$PUBLISH_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R site/. "$PUBLISH_DIR"/
          touch "$PUBLISH_DIR/.nojekyll"
          cd "$PUBLISH_DIR"
          git add --all
          if git diff --cached --quiet; then
            echo "gh-pages already matches this build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force-with-lease="refs/heads/gh-pages:${pages_base_sha}" origin HEAD:gh-pages

      - name: Verify published privacy policy
        run: |
          privacy_url="https://abubakrmmarufov-tech.github.io/zarbulmasal/privacy.html"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 20 "$privacy_url" \
              | grep -Fq 'Zarbulmasal Privacy Policy'; then
              echo "Published privacy policy verified at $privacy_url"
              exit 0
            fi
            echo "Waiting for GitHub Pages to publish privacy policy (attempt $attempt/12)..."
            sleep 5
          done
          echo "Published privacy policy was not available at $privacy_url" >&2
          exit 1
