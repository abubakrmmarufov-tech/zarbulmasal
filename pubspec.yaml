name: zarbulmasal
description: "Zarbulmasal — a Tajik proverb reading and learning app."
publish_to: 'none'
homepage: https://abubakrmmarufov-tech.github.io/zarbulmasal/
repository: https://github.com/abubakrmmarufov-tech/zarbulmasal
issue_tracker: https://github.com/abubakrmmarufov-tech/zarbulmasal/issues
version: 2.0.0+2005

environment:
  sdk: ^3.12.1
  flutter: 3.47.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-OFL.txt
    - assets/fonts/NotoSerif-OFL.txt
    - assets/fonts/NotoNaskhArabic-OFL.txt
    - assets/fonts/EBGaramond-OFL.txt
    - assets/fonts/PTSerif-OFL.txt
    - assets/fonts/GolosText-OFL.txt
    - assets/fonts/NotoNastaliqUrdu-OFL.txt
    - assets/fonts/Vazirmatn-OFL.txt
    # «Муҳр» seal artwork — a PLACEHOLDER until the commissioned seal arrives.
    - assets/data/literature/poets.json
    # The canonical assets/data/literature/works.json stays in the repo as the
    # editorial source of truth; the app ships the derived runtime catalog
    # built by tool/build_runtime_literature.dart.
    - assets/data/literature/runtime_works.json
    - assets/data/literature/sources.json
    - assets/data/literature/school_canon.json
    - assets/data/literature/oral_heritage.json
    - assets/data/literature/portraits/
    - assets/data/history/books.json
    - assets/data/history/entries.json
    - assets/data/books/providers.json
    - assets/data/books/books.json
    - assets/data/books/covers/
    # The Luғатнома lexicon: reviewed lexical headword–definition pairs.
    - assets/data/vocabulary/words.json
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    # «Муҳр» typefaces (SIL OFL 1.1), built by tool/design/build_fonts.py as
    # subset static instances. The Noto families above remain as fallbacks.
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/EBGaramond-Italic.ttf
          weight: 400
          style: italic
    - family: PTSerif
      fonts:
        - asset: assets/fonts/PTSerif-Regular.ttf
        - asset: assets/fonts/PTSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/PTSerif-Italic.ttf
          style: italic
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText-Regular.ttf
        - asset: assets/fonts/GolosText-Medium.ttf
          weight: 500
        - asset: assets/fonts/GolosText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GolosText-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
